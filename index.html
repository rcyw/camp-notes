<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Camp Notes — a focused, local-first notes app. Your notes stay in this browser." />
  <title>Camp Notes</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app" class="app" hidden>
    <header class="topbar">
      <button type="button" id="sidebar-toggle" class="icon-btn" aria-label="Toggle notes list" title="Toggle notes list (Ctrl+B)">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M3 5h18v2H3zm0 6h18v2H3zm0 6h18v2H3z"/></svg>
      </button>
      <h1 class="app-title">Camp Notes</h1>
      <div class="topbar-actions">
        <button type="button" id="search-toggle" class="icon-btn" aria-label="Search notes" title="Search (Ctrl+F)">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
        </button>
        <button type="button" id="new-note-btn" class="btn btn-primary">New note</button>
      </div>
    </header>

    <div class="layout">
      <nav class="sidebar" id="sidebar" aria-label="Notes">
        <div class="search-row" id="search-row">
          <input type="search" id="search-input" placeholder="Search notes…" aria-label="Search notes" />
        </div>
        <div class="view-tabs" aria-label="Note views">
          <button type="button" class="view-tab" data-view="notes" aria-pressed="true">Notes</button>
          <button type="button" class="view-tab" data-view="archive" aria-pressed="false">Archive</button>
          <button type="button" class="view-tab" data-view="trash" aria-pressed="false">Trash</button>
        </div>
        <ul class="note-list" id="note-list" aria-label="Notes list"></ul>
        <div class="sidebar-footer">
          <button type="button" id="export-btn" class="btn btn-ghost">Export</button>
          <button type="button" id="import-btn" class="btn btn-ghost">Import</button>
          <button type="button" id="empty-trash-btn" class="btn btn-ghost btn-danger" hidden>Empty trash</button>
          <input type="file" id="import-file" accept="application/json,.json" hidden />
        </div>
      </nav>

      <main class="editor-pane" id="editor-pane">
        <div class="empty-state" id="empty-state">
          <h2 id="empty-state-title">Welcome to Camp Notes</h2>
          <p id="empty-state-text">Your notes are stored only in this browser. Create a note to get started.</p>
          <button type="button" id="empty-new-btn" class="btn btn-primary">New note</button>
        </div>

        <div class="editor" id="editor" hidden>
          <div class="editor-toolbar">
            <button type="button" id="pin-btn" class="icon-btn" aria-pressed="false" aria-label="Pin note" title="Pin note">
              <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M16 12V4h1V2H7v2h1v8l-2 2v2h5.2v6h1.6v-6H18v-2z"/></svg>
            </button>
            <button type="button" id="archive-btn" class="btn btn-ghost btn-sm">Archive</button>
            <button type="button" id="trash-btn" class="btn btn-ghost btn-sm btn-danger">Trash</button>
            <span class="toolbar-spacer"></span>
            <span class="saved-status" id="saved-status">Saved</span>
          </div>
          <input type="text" id="note-title" class="note-title" placeholder="Untitled" aria-label="Note title" />
          <textarea id="note-body" class="note-body" placeholder="Write in Markdown…" aria-label="Note body"></textarea>
          <div class="preview-toggle" aria-label="Editor mode">
            <button type="button" class="mode-tab" data-mode="edit" aria-pressed="true">Edit</button>
            <button type="button" class="mode-tab" data-mode="preview" aria-pressed="false">Preview</button>
          </div>
          <div class="preview" id="preview" hidden></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal and banner live outside #app so `app.inert` never disables them
       (inert is inherited and cannot be overridden by a child). -->
  <div class="dialog-backdrop" id="dialog" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-body">
      <h2 class="dialog-title" id="dialog-title"></h2>
      <div class="dialog-body" id="dialog-body"></div>
      <div class="dialog-actions" id="dialog-actions"></div>
    </div>
  </div>

  <div class="storage-error" id="storage-error" role="alert" hidden>
    <span id="storage-error-text"></span>
    <button type="button" id="storage-error-export" class="btn btn-sm">Export</button>
    <button type="button" id="storage-error-dismiss" class="icon-btn" aria-label="Dismiss storage warning">
      <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>

  <noscript><p>Camp Notes requires JavaScript to run.</p></noscript>
  <script type="module" src="./src/app.mjs"></script>
</body>
</html>
